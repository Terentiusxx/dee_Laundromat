services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dees
      POSTGRES_USER: dees
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-local-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dees -d dees"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://dees:${LOCAL_POSTGRES_PASSWORD:-local-change-me}@db:5432/dees
      DEMO_MODE: "true"
      COOKIE_SECURE: "false"
      PUBLIC_ORIGIN: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 4s
      retries: 8
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_ORIGIN: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
volumes:
  postgres_data:
