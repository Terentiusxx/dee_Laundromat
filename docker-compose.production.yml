services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dees
      POSTGRES_USER: dees
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dees -d dees"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://dees:${POSTGRES_PASSWORD}@db:5432/dees
      DEMO_MODE: "false"
      COOKIE_SECURE: "true"
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 4s
      retries: 8
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_ORIGIN: http://api:8000
    depends_on:
      api:
        condition: service_healthy
  caddy:
    image: caddy:2.8-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
